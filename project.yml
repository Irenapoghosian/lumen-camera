name: Lumen
options:
  bundleIdPrefix: com.irenapoghosian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Lumen:
    type: application
    platform: iOS
    sources: [Lumen]
    info:
      path: Lumen/Info.plist
      properties:
        CFBundleDisplayName: Lumen
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Lumen uses the camera to take photos with live filters.
        NSPhotoLibraryAddUsageDescription: Lumen saves the photos you take to your library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosian.lumen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LumenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumenTests]
    dependencies:
      - target: Lumen
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lumen:
    build:
      targets:
        Lumen: all
        LumenTests: [test]
    test:
      targets: [LumenTests]
